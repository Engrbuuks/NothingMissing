<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing Missing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5B4BE8;
  --brand-2:#8B7BF5;
  --brand-ink:#3B2FB0;
  --brand-soft:#EEEBFE;
  --ink:#101223;
  --ink-2:#1A1D33;
  --ink-3:#262A45;
  --canvas:#F3F4FB;
  --surface:#FFFFFF;
  --text:#14161F;
  --text-2:#5F6379;
  --text-3:#9296AC;
  --line:#E8E9F2;
  --line-2:#F1F2F8;
  --ok:#0FA45E;   --ok-soft:#E4F7ED;
  --warn:#E39A11; --warn-soft:#FDF3E0;
  --bad:#E14B42;  --bad-soft:#FDECEB;
  --sky:#2E7FF0;  --sky-soft:#E7F0FE;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --sans:'Inter',system-ui,sans-serif;
  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sb:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--canvas);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.02em;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D3D6E4;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#B9BDD0;background-clip:content-box}

/* ---------- SIDEBAR ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--ink);display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 20px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px -4px var(--brand)}
.brand-mark svg{width:19px;height:19px;stroke:#fff}
.brand-name{font-family:var(--display);font-weight:800;color:#fff;font-size:16px;letter-spacing:-.03em;line-height:1.1}
.brand-sub{font-size:10.5px;color:#7A7F9E;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav::-webkit-scrollbar-thumb{background:#2B2F4C;background-clip:content-box}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#61668A;padding:16px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 11px;border-radius:11px;color:#A5A9C4;font-size:13.5px;font-weight:500;transition:.15s;text-align:left;position:relative}
.nav-item svg{width:17px;height:17px;stroke:currentColor;flex:none}
.nav-item:hover{background:#1B1E33;color:#DCDEEC}
.nav-item.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 6px 18px -6px var(--brand)}
.nav-item .pip{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:20px;display:grid;place-items:center;padding:0 5px}
.nav-item.on .pip{background:rgba(255,255,255,.24)}
.sb-foot{padding:12px;border-top:1px solid #22253D}
.sb-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;transition:.15s;width:100%;text-align:left}
.sb-user:hover{background:#1B1E33}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12.5px;color:#fff;flex:none;letter-spacing:-.02em}
.sb-user-n{color:#EAEBF4;font-size:13px;font-weight:600;line-height:1.3}
.sb-user-r{color:#71769A;font-size:11.5px}

/* ---------- TOPBAR ---------- */
.main{margin-left:var(--sb);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:0 30px;height:70px;display:flex;align-items:center;gap:16px}
.burger{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);place-items:center}
.burger svg{width:19px;height:19px;stroke:var(--text-2)}
.pt-wrap{min-width:0}
.pt{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-sub{font-size:12.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.scope{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.scope:hover{border-color:#CFD2E4}
.scope .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.scope svg{width:14px;height:14px;stroke:var(--text-3)}
.scope-lock{background:var(--line-2);color:var(--text-2);cursor:default}
.scope-lock:hover{border-color:var(--line)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;transition:.15s}
.iconbtn:hover{border-color:#CFD2E4;background:#FBFBFE}
.iconbtn svg{width:17px;height:17px;stroke:var(--text-2)}
.iconbtn .ndot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:1.5px solid #fff}
.roleswitch{display:flex;background:var(--line-2);border-radius:11px;padding:3px;gap:2px}
.roleswitch button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s;white-space:nowrap}
.roleswitch button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,18,35,.09)}

/* ---------- LAYOUT ---------- */
.view{display:none;padding:26px 30px 60px;flex:1}
.view.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.card-h{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.card-h.bd{padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.card-t{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.card-s{font-size:12.5px;color:var(--text-3);margin-top:2px}
.card-h .act{margin-left:auto}
.linkbtn{font-size:12.5px;font-weight:600;color:var(--brand);padding:6px 10px;border-radius:9px;transition:.15s;white-space:nowrap}
.linkbtn:hover{background:var(--brand-soft)}

/* ---------- BUTTONS / PILLS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:16px;height:16px;stroke:currentColor;flex:none}
.btn-p{background:var(--brand);color:#fff;box-shadow:0 6px 16px -8px var(--brand)}
.btn-p:hover{background:var(--brand-ink)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-g:hover{border-color:#CFD2E4;background:#FBFBFE}
.btn-d{background:var(--ink);color:#fff}
.btn-d:hover{background:var(--ink-3)}
.btn-lg{padding:14px 24px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4.5px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .pd{width:5.5px;height:5.5px;border-radius:50%;background:currentColor;flex:none}
.p-ok{background:var(--ok-soft);color:#0A7A45}
.p-warn{background:var(--warn-soft);color:#A6700A}
.p-bad{background:var(--bad-soft);color:#B5332B}
.p-sky{background:var(--sky-soft);color:#1C5FC0}
.p-br{background:var(--brand-soft);color:var(--brand-ink)}
.p-mute{background:var(--line-2);color:var(--text-2)}

/* ---------- ACTION BAND ---------- */
.band{background:var(--ink);border-radius:var(--r-lg);padding:24px 26px;position:relative;overflow:hidden}
.band::after{content:'';position:absolute;top:-90px;right:-50px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 68%);opacity:.42;pointer-events:none}
.band-top{display:flex;align-items:flex-start;gap:16px;position:relative;z-index:1;flex-wrap:wrap}
.band h2{color:#fff;font-size:21px;font-weight:800}
.band p{color:#8B90B2;font-size:13px;margin-top:4px}
.band-date{margin-left:auto;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);color:#C9CCE2;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:11px;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;position:relative;z-index:1}
.act-tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px 16px;text-align:left;transition:.18s}
.act-tile:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.act-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:11px}
.act-ic svg{width:16px;height:16px;stroke:#fff}
.act-n{font-family:var(--display);font-size:25px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}
.act-l{font-size:12.5px;color:#9296B8;margin-top:5px;font-weight:500}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 19px}
.kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kpi-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:18px;height:18px}
.trend{margin-left:auto;font-size:11.5px;font-weight:700;padding:3.5px 8px;border-radius:8px;display:flex;align-items:center;gap:3px}
.trend svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.6}
.kpi-v{font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kpi-l{font-size:12.5px;color:var(--text-3);margin-top:5px}

/* ---------- CATEGORY CARDS ---------- */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px 20px 20px}
.cat{border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:left;transition:.18s;background:var(--surface)}
.cat:hover{border-color:var(--brand);box-shadow:0 8px 22px -14px var(--brand);transform:translateY(-2px)}
.cat-top{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.cat-ic{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;flex:none}
.cat-ic svg{width:15px;height:15px}
.cat-n{font-size:13px;font-weight:600;line-height:1.25}
.cat-c{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cat-u{font-size:11.5px;color:var(--text-3);margin-left:5px;font-weight:500}
.bar{display:flex;height:5px;border-radius:5px;overflow:hidden;background:var(--line-2);margin-top:11px;gap:1.5px}
.bar i{display:block;height:100%}
.bar-k{display:flex;gap:11px;flex-wrap:wrap;margin-top:9px}
.bar-k span{font-size:10.5px;color:var(--text-3);display:flex;align-items:center;gap:4px;font-weight:500}
.bar-k i{width:6px;height:6px;border-radius:2px}

/* ---------- TRANSIT TRACKER (signature) ---------- */
.tt{padding:6px 20px 20px;display:flex;flex-direction:column;gap:14px}
.trip{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;transition:.18s;text-align:left;width:100%;background:var(--surface)}
.trip:hover{border-color:var(--brand);box-shadow:0 8px 22px -14px var(--brand)}
.trip-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.trip-w{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--text-2);letter-spacing:-.01em}
.trip-h .pill{margin-left:auto}
.track{position:relative;padding:0 2px}
.track-line{position:relative;height:2px;background:var(--line);border-radius:2px;margin:0 8px}
.track-fill{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:2px}
.track-node{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line);transform:translate(-50%,-50%)}
.track-node.done{border-color:var(--brand);background:var(--brand)}
.track-van{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:9px;background:var(--brand);display:grid;place-items:center;box-shadow:0 4px 12px -3px var(--brand);border:2.5px solid var(--surface)}
.track-van svg{width:13px;height:13px;stroke:#fff;stroke-width:2}
.track-ends{display:flex;justify-content:space-between;margin-top:14px;gap:12px}
.track-ends div{min-width:0}
.te-l{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.te-v{font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.te-r{text-align:right}
.trip-f{display:flex;align-items:center;gap:14px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--text-2)}
.trip-f b{color:var(--text);font-weight:600}
.trip-f .age{margin-left:auto;font-weight:600}

/* ---------- FEED ---------- */
.feed{padding:4px 20px 16px}
.fi{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.fi:last-child{border-bottom:none}
.fi-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;margin-top:1px}
.fi-ic svg{width:15px;height:15px}
.fi-t{font-size:13px;line-height:1.45}
.fi-t b{font-weight:600}
.fi-m{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---------- TOOLBAR / TABLE ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-3)}
.search input{width:100%;padding:10px 13px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px}
.search input::placeholder{color:var(--text-3)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sel{padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:500;cursor:pointer;min-width:132px}
.sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
thead th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFBFE}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tbody tr{transition:.13s;cursor:pointer}
tbody tr:hover{background:#FAFAFE}
tbody tr.picked{background:var(--brand-soft)}
tbody tr:last-child td{border-bottom:none}
.cbx{width:17px;height:17px;border-radius:5px;border:1.5px solid #C9CCDE;display:grid;place-items:center;transition:.13s;flex:none;background:#fff}
.cbx svg{width:11px;height:11px;stroke:#fff;stroke-width:3.2;opacity:0}
.cbx.on{background:var(--brand);border-color:var(--brand)}
.cbx.on svg{opacity:1}
.tag{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text-2);letter-spacing:-.02em}
.aname{font-weight:600;font-size:13.5px}
.amake{font-size:11.5px;color:var(--text-3);margin-top:1px}
.loc{display:flex;align-items:center;gap:7px;font-size:13px}
.loc .lic{width:6px;height:6px;border-radius:2px;flex:none}
.empty{padding:56px 20px;text-align:center}
.empty svg{width:34px;height:34px;stroke:var(--text-3);margin-bottom:12px}
.empty h4{font-size:15px;margin-bottom:5px}
.empty p{font-size:13px;color:var(--text-3);max-width:330px;margin:0 auto}

/* ---------- SELECTION BAR ---------- */
.selbar{position:fixed;left:calc(var(--sb) + 30px);right:30px;bottom:22px;z-index:35;background:var(--ink);border-radius:16px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 44px -14px rgba(16,18,35,.55);transform:translateY(150%);transition:transform .28s cubic-bezier(.2,.8,.3,1);flex-wrap:wrap}
.selbar.up{transform:none}
.selbar-c{color:#fff;font-size:13.5px;font-weight:600}
.selbar-c b{font-family:var(--display);font-size:16px;font-weight:800;margin-right:2px}
.selbar-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.selbar-acts .btn-g{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:#E6E7F0}
.selbar-acts .btn-g:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25)}

/* ---------- DETAIL ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-2);padding:7px 12px 7px 9px;border-radius:10px;margin-bottom:16px;transition:.15s}
.back:hover{background:var(--surface);color:var(--text)}
.back svg{width:16px;height:16px;stroke:currentColor}
.dhead{display:flex;gap:20px;padding:22px;flex-wrap:wrap}
.dphoto{width:112px;height:112px;border-radius:16px;display:grid;place-items:center;flex:none}
.dphoto svg{width:40px;height:40px}
.dhead-main{flex:1;min-width:200px}
.dhead h1{font-size:23px;letter-spacing:-.035em}
.dmeta{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.dfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line-2);border-top:1px solid var(--line)}
.fact{background:var(--surface);padding:15px 18px}
.fact-l{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.fact-v{font-size:14px;font-weight:600;margin-top:5px}
.tl{padding:6px 20px 20px}
.tl-i{display:flex;gap:14px;position:relative;padding-bottom:22px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:15.5px;top:34px;bottom:-2px;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;z-index:1;border:2.5px solid var(--surface)}
.tl-ic svg{width:14px;height:14px}
.tl-b{flex:1;min-width:0;padding-top:1px}
.tl-t{font-size:13.5px;font-weight:600;line-height:1.4}
.tl-d{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.5}
.tl-m{font-size:11.5px;color:var(--text-3);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tl-m .mono{font-size:11px}
.locked{padding:20px;display:flex;gap:13px;align-items:flex-start;background:#FBFBFE;border-radius:var(--r);border:1px dashed var(--line);margin:0 20px 20px}
.locked svg{width:19px;height:19px;stroke:var(--text-3);flex:none;margin-top:1px}
.locked h5{font-size:13.5px;font-weight:600;margin-bottom:3px}
.locked p{font-size:12.5px;color:var(--text-3);line-height:1.5}
.fin{padding:4px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:var(--r);overflow:hidden;margin:0 20px 20px;border:1px solid var(--line)}
.fin>div{background:var(--surface);padding:15px 17px}

/* ---------- ACCEPT ---------- */
.accept-wrap{max-width:840px;margin:0 auto}
.wbhead{background:var(--ink);border-radius:var(--r-lg);padding:22px 24px;position:relative;overflow:hidden;margin-bottom:18px}
.wbhead::after{content:'';position:absolute;top:-110px;right:-40px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 70%);opacity:.4}
.wbhead-r{position:relative;z-index:1}
.wbh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.wbh-w{font-family:var(--mono);font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em}
.wbh-route{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wbh-route .te-l{color:#71769A}
.wbh-route .te-v{color:#fff;font-size:14px}
.wbh-arrow{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.wbh-arrow svg{width:15px;height:15px;stroke:#fff}
.mani{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line-2);transition:.15s}
.mani:last-of-type{border-bottom:none}
.mani.flagged{background:var(--warn-soft)}
.mani-b{flex:1;min-width:0}
.mani-n{font-size:13.5px;font-weight:600}
.flagbtn{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-2);transition:.15s;background:var(--surface);white-space:nowrap}
.flagbtn:hover{border-color:var(--warn);color:#A6700A}
.flagbtn svg{width:14px;height:14px;stroke:currentColor}
.flagbtn.on{background:var(--warn);border-color:var(--warn);color:#fff}
.acceptbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.acceptbar-s{font-size:13px;color:var(--text-2)}
.acceptbar-s b{color:var(--text);font-weight:700}

/* ---------- REQUESTS ---------- */
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:13px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-2);transition:.15s;display:flex;align-items:center;gap:7px}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(16,18,35,.08)}
.tab .cnt{background:var(--line);color:var(--text-2);font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px}
.tab.on .cnt{background:var(--brand);color:#fff}
.steps{display:flex;align-items:flex-start;gap:0;padding:20px;flex-wrap:wrap}
.step{flex:1;min-width:118px;position:relative;padding-right:12px}
.step-d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--line);color:var(--text-3);margin-bottom:9px;position:relative;z-index:1;border:2.5px solid var(--surface)}
.step-d svg{width:12px;height:12px;stroke:#fff;stroke-width:3}
.step.done .step-d{background:var(--ok);color:#fff}
.step.now .step-d{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.step::after{content:'';position:absolute;left:26px;top:13px;right:0;height:2px;background:var(--line)}
.step.done::after{background:var(--ok)}
.step:last-child::after{display:none}
.step-t{font-size:12.5px;font-weight:600;line-height:1.3}
.step-m{font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.4}

/* ---------- SETTINGS ---------- */
.setgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
.field{padding:0 20px 18px}
.lbl{font-size:12.5px;font-weight:600;margin-bottom:7px;display:block}
.hint{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--surface)}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.logo-drop{display:flex;align-items:center;gap:15px;padding:15px;border:1px dashed var(--line);border-radius:var(--r);background:#FBFBFE}
.logo-prev{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;color:#fff;font-size:20px;letter-spacing:-.04em}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:11px;border:2.5px solid transparent;transition:.15s;position:relative}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--surface) inset}
/* waybill preview */
.wbdoc{background:#fff;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:0 14px 40px -20px rgba(16,18,35,.3)}
.wb-strip{height:7px;background:var(--brand)}
.wb-top{display:flex;gap:14px;padding:20px 22px 18px;align-items:flex-start;border-bottom:1px solid var(--line-2)}
.wb-logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:16px;flex:none;letter-spacing:-.04em}
.wb-co{font-family:var(--display);font-weight:800;font-size:15.5px;letter-spacing:-.025em;line-height:1.2}
.wb-ad{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.45}
.wb-ttl{margin-left:auto;text-align:right;flex:none}
.wb-ttl h4{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.wb-no{font-family:var(--mono);font-size:12px;font-weight:700;margin-top:4px}
.wb-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2)}
.wb-grid>div{background:#fff;padding:13px 22px}
.wb-l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.wb-v{font-size:12.5px;font-weight:600;margin-top:3px}
.wb-tbl{padding:6px 22px 0}
.wb-tbl table{min-width:0}
.wb-tbl th{background:transparent;padding:9px 0;font-size:10px;border-bottom:1.5px solid var(--brand)}
.wb-tbl td{padding:9px 0;font-size:11.5px;border-bottom:1px solid var(--line-2)}
.wb-foot{padding:16px 22px 20px;display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}
.wb-sig{flex:1;min-width:120px}
.wb-sigline{border-bottom:1.5px dotted #C9CCDE;height:26px}
.wb-sigl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-top:6px}
.wb-note{background:var(--brand);color:#fff;padding:9px 22px;font-size:10.5px;text-align:center;font-weight:500;letter-spacing:.01em}

/* ---------- LOCATION LINK ---------- */
.linkrow{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.linkrow:last-child{border-bottom:none}
.linkurl{font-family:var(--mono);font-size:11.5px;color:var(--text-2);background:var(--line-2);padding:5px 9px;border-radius:7px;word-break:break-all}

/* ---------- TOAST ---------- */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:80;box-shadow:0 16px 40px -12px rgba(16,18,35,.55);display:flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.2,.8,.3,1);max-width:calc(100vw - 40px)}
.toast.up{transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;stroke:var(--ok);flex:none}
.scrim{position:fixed;inset:0;background:rgba(16,18,35,.5);z-index:39;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}




/* ---------- BUILD 3 ---------- */
.modal-wrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,18,35,.55);backdrop-filter:blur(3px)}
.modal-wrap.on{display:flex;animation:mfade .2s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:20px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(16,18,35,.5)}
.modal-h{padding:22px 24px 0;display:flex;gap:14px;align-items:flex-start}
.modal-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.modal-ic svg{width:19px;height:19px}
.modal-h h3{font-size:17px}
.modal-h p{font-size:13px;color:var(--text-3);margin-top:4px;line-height:1.5}
.modal-b{padding:18px 24px 0;font-size:13.5px;color:var(--text-2);line-height:1.6}
.modal-f{padding:20px 24px 22px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.crumb button{color:var(--text-3);font-weight:500;padding:4px 8px;border-radius:8px;transition:.13s}
.crumb button:hover{background:var(--surface);color:var(--text)}
.crumb .sep{color:var(--text-3);display:flex}
.crumb .sep svg{width:13px;height:13px;stroke:currentColor}
.crumb .cur{font-weight:600;padding:4px 8px}
.tile2{border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;transition:.18s;background:var(--surface);display:flex;align-items:center;gap:13px;width:100%}
.tile2:hover{border-color:var(--brand);box-shadow:0 8px 22px -14px var(--brand);transform:translateY(-2px)}
.tile2-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.03em}
.tile2-ic svg{width:18px;height:18px}
.tile2-n{font-size:14px;font-weight:600;line-height:1.3}
.tile2-m{font-size:12px;color:var(--text-3);margin-top:2px}
.tile2-c{margin-left:auto;text-align:right;flex:none}
.tile2-c b{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.03em}
.tile2-c span{display:block;font-size:11px;color:var(--text-3)}
.gridauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px;padding:18px 20px 20px}
.spec{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.spec:last-child{border-bottom:none}
.spec span:first-child{color:var(--text-3)}
.spec span:last-child{font-weight:600;text-align:right}
.ai{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.03em;background:var(--brand-soft);color:var(--brand-ink)}
.ai svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.4}
.askbar{background:var(--ink);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden;margin-bottom:18px}
.askbar::after{content:'';position:absolute;top:-100px;right:-40px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 70%);opacity:.42}
.askbar-r{position:relative;z-index:1}
.askin{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.askin input{flex:1;min-width:200px;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;font-size:14.5px}
.askin input::placeholder{color:#71769A}
.askin input:focus{outline:none;border-color:var(--brand);background:rgba(255,255,255,.11)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 13px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#C9CCE2;font-size:12.5px;font-weight:500;transition:.15s}
.chip:hover{background:rgba(255,255,255,.16);color:#fff}
.conf{display:flex;align-items:center;gap:8px}
.conf-bar{width:52px;height:5px;border-radius:5px;background:var(--line-2);overflow:hidden;flex:none}
.conf-bar i{display:block;height:100%;border-radius:5px}
.conf span{font-size:11.5px;font-weight:600;font-family:var(--mono)}
.ins{display:flex;gap:14px;padding:17px 20px;border-bottom:1px solid var(--line-2)}
.ins:last-child{border-bottom:none}
.ins-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ins-ic svg{width:17px;height:17px}
.ins-t{font-size:14px;font-weight:600;line-height:1.4}
.ins-d{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.55}
.ins-a{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.sw-t{position:relative;width:38px;height:22px;border-radius:11px;background:#CFD2E4;transition:.18s;flex:none;cursor:pointer;border:none;padding:0}
.sw-t.on{background:var(--brand)}
.sw-t i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on i{transform:translateX(16px)}
.mailrow{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.mailrow:last-child{border-bottom:none}
.mailrow-b{flex:1;min-width:190px}
.mailrow-n{font-size:13.5px;font-weight:600}
.mailto{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.mailto span{font-size:11px;font-weight:600;background:var(--line-2);color:var(--text-2);padding:2.5px 8px;border-radius:7px}
.mail{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px -22px rgba(16,18,35,.3)}
.mail-bar{height:6px;background:var(--brand)}
.mail-hd{padding:18px 22px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:center}
.mail-lg{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:13px;flex:none;letter-spacing:-.04em}
.mail-fr{font-size:12.5px;font-weight:600}
.mail-to{font-size:11.5px;color:var(--text-3);margin-top:1px}
.mail-sub{padding:18px 22px 0;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.mail-bd{padding:12px 22px 0;font-size:13px;color:var(--text-2);line-height:1.65}
.mail-bd b{color:var(--text);font-weight:600}
.mail-box{margin:14px 0;padding:13px 15px;background:#FBFBFE;border:1px solid var(--line);border-radius:11px}
.mail-box .fact-l{margin-bottom:3px}
.mail-cta{display:inline-block;background:var(--brand);color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;margin:6px 0 18px}
.mail-ft{padding:14px 22px;border-top:1px solid var(--line-2);font-size:11px;color:var(--text-3);line-height:1.5}
.warn-box{display:flex;gap:12px;background:var(--bad-soft);border-radius:var(--r);padding:14px 16px}
.warn-box svg{width:19px;height:19px;stroke:#B5332B;flex:none;margin-top:1px}
.warn-box p{font-size:12.5px;color:#B5332B;line-height:1.55}
.arch{opacity:.55}


/* ================= BUILD 4 ================= */
/* ---- dashboard: hero ---- */
.dash{display:flex;flex-direction:column;gap:18px}
.dash>*{animation:rise .55s cubic-bezier(.2,.85,.3,1) backwards}
.dash>*:nth-child(1){animation-delay:.02s}
.dash>*:nth-child(2){animation-delay:.09s}
.dash>*:nth-child(3){animation-delay:.16s}
.dash>*:nth-child(4){animation-delay:.23s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{background:var(--ink);border-radius:26px;padding:30px 32px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px;align-items:center}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 0);background-size:22px 22px;pointer-events:none}
.hero::after{content:'';position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--brand) 0%,transparent 66%);opacity:.38;pointer-events:none}
.hero-l,.hero-r{position:relative;z-index:1;min-width:0}
.hero-eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.hero-eyebrow .tagx{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A7F9E}
.hero-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#5DCAA5;background:rgba(93,202,165,.12);border:1px solid rgba(93,202,165,.22);padding:4px 9px;border-radius:20px}
.hero-live i{width:6px;height:6px;border-radius:50%;background:#5DCAA5;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{color:#fff;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.hero-sub{color:#8B90B2;font-size:13.5px;margin-top:7px;line-height:1.55;max-width:440px}
.hero-fig{display:flex;align-items:flex-end;gap:14px;margin-top:24px;flex-wrap:wrap}
.hero-num{font-family:var(--display);font-size:46px;font-weight:800;color:#fff;letter-spacing:-.045em;line-height:.95}
.hero-delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(93,202,165,.14);color:#5DCAA5;margin-bottom:5px}
.hero-delta svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.8}
.hero-cap{font-size:12px;color:#71769A;margin-top:9px}
.hero-spark{margin-top:16px}
.hero-strip{display:flex;gap:0;margin-top:22px;border-top:1px solid rgba(255,255,255,.09);padding-top:18px;flex-wrap:wrap}
.hs{flex:1;min-width:96px;padding-right:16px}
.hs-v{font-family:var(--display);font-size:19px;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1}
.hs-l{font-size:11.5px;color:#71769A;margin-top:5px}
.hero-donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-c{position:relative;flex:none}
.donut-mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-mid b{display:block;font-family:var(--display);font-size:27px;font-weight:800;color:#fff;letter-spacing:-.035em;line-height:1}
.donut-mid span{display:block;font-size:10.5px;color:#71769A;margin-top:4px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.dleg{display:flex;flex-direction:column;gap:11px;min-width:0}
.dleg-i{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#A5A9C4;white-space:nowrap}
.dleg-i i{width:8px;height:8px;border-radius:3px;flex:none}
.dleg-i b{color:#fff;font-weight:700;margin-left:auto;padding-left:14px;font-family:var(--mono);font-size:12.5px}

/* ---- action rail ---- */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px 18px;text-align:left;transition:.2s;position:relative;overflow:hidden}
.rtile::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc);opacity:0;transition:.2s}
.rtile:hover{border-color:var(--rc);transform:translateY(-3px);box-shadow:0 14px 30px -18px var(--rc)}
.rtile:hover::after{opacity:1}
.rtile-top{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.rtile-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.rtile-ic svg{width:16px;height:16px}
.rtile-go{margin-left:auto;color:var(--text-3);opacity:0;transform:translateX(-4px);transition:.2s}
.rtile:hover .rtile-go{opacity:1;transform:none}
.rtile-go svg{width:16px;height:16px;stroke:currentColor}
.rtile-n{font-family:var(--display);font-size:29px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rtile-l{font-size:12.5px;color:var(--text-2);margin-top:6px;font-weight:500}
.rtile-m{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---- charts ---- */
.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.chart-wrap{padding:8px 20px 18px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%;position:relative;cursor:default}
.bseg{border-radius:4px;transition:.25s;min-height:2px}
.bcol:hover .bseg{filter:brightness(1.12)}
.bx{display:flex;gap:10px;margin-top:10px}
.bx span{flex:1;text-align:center;font-size:11px;color:var(--text-3);font-weight:500}
.leg{display:flex;gap:16px;flex-wrap:wrap;padding:0 20px 4px}
.leg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:500}
.leg i{width:9px;height:9px;border-radius:3px}
.comp{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;margin:4px 20px 0}
.comp i{transition:.25s;cursor:default}
.comp i:hover{filter:brightness(1.1)}
.complist{padding:16px 20px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px}
.ci{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;transition:.15s;text-align:left;width:100%}
.ci:hover{background:#FAFAFE}
.ci-d{width:9px;height:9px;border-radius:3px;flex:none}
.ci-n{font-size:12.5px;font-weight:600;line-height:1.25}
.ci-m{font-size:11px;color:var(--text-3);margin-top:1px}
.ci-v{margin-left:auto;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.03em}

/* ---- location performance ---- */
.perf-bar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;min-width:70px}
.perf-bar i{display:block;height:100%;border-radius:6px}

/* ---- command palette ---- */
.cmd-wrap{position:fixed;inset:0;z-index:95;display:none;justify-content:center;padding:80px 20px 20px;background:rgba(16,18,35,.5);backdrop-filter:blur(4px)}
.cmd-wrap.on{display:flex;animation:mfade .16s ease}
.cmd{background:var(--surface);border-radius:18px;width:100%;max-width:600px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(16,18,35,.55);align-self:flex-start}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmd-in svg{width:19px;height:19px;stroke:var(--text-3);flex:none}
.cmd-in input{flex:1;border:none;font-size:16px;background:transparent;min-width:0}
.cmd-in input:focus{outline:none}
.cmd-in kbd{font-family:var(--mono);font-size:10.5px;background:var(--line-2);color:var(--text-3);padding:4px 7px;border-radius:6px;flex:none}
.cmd-list{overflow-y:auto;padding:8px}
.cmd-g{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding:12px 12px 6px}
.cmd-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;width:100%;text-align:left;transition:.1s}
.cmd-i:hover,.cmd-i.sel{background:var(--brand-soft)}
.cmd-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.cmd-ic svg{width:15px;height:15px}
.cmd-n{font-size:13.5px;font-weight:600}
.cmd-m{font-size:11.5px;color:var(--text-3);margin-top:1px}
.cmd-k{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3);flex:none}
.cmd-empty{padding:36px 20px;text-align:center;color:var(--text-3);font-size:13px}
.kbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px;color:var(--text-3);transition:.15s;min-width:150px}
.kbtn:hover{border-color:#CFD2E4}
.kbtn svg{width:15px;height:15px;stroke:currentColor;flex:none}
.kbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--line-2);padding:3px 6px;border-radius:5px}

/* ---- notification drawer ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);z-index:92;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(16,18,35,.35)}
.drawer.on{transform:none}
.drawer-h{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer-b{flex:1;overflow-y:auto}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line)}
.nt{display:flex;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line-2);transition:.13s;text-align:left;width:100%;position:relative}
.nt:hover{background:#FAFAFE}
.nt.unread{background:var(--brand-soft)}
.nt.unread::before{content:'';position:absolute;left:8px;top:22px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.nt-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.nt-ic svg{width:15px;height:15px}
.nt-t{font-size:13px;line-height:1.45}
.nt-t b{font-weight:600}
.nt-m{font-size:11.5px;color:var(--text-3);margin-top:4px}

/* ---- reports ---- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:18px 20px 20px}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;transition:.18s;background:var(--surface)}
.rcard:hover{border-color:var(--brand);box-shadow:0 8px 22px -14px var(--brand);transform:translateY(-2px)}
.rcard-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.rcard-ic svg{width:17px;height:17px}
.rcard-n{font-size:13.5px;font-weight:600;line-height:1.3}
.rcard-m{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.45}

/* ---- tag sheet ---- */
.tagsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;background:#FBFBFE}
.tagcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.qr{width:74px;height:74px;margin:0 auto 9px;display:block}
.tagcard-t{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:-.02em}
.tagcard-n{font-size:10px;color:var(--text-3);margin-top:3px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagcard-c{font-size:8.5px;color:var(--text-3);margin-top:5px;letter-spacing:.04em}
.scanbox{border:2px dashed var(--line);border-radius:20px;padding:40px 24px;text-align:center;background:#FBFBFE}
.scanbox .scanring{width:82px;height:82px;border-radius:26px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 18px}
.scanbox .scanring svg{width:36px;height:36px}

@media(max-width:1180px){
  .hero{grid-template-columns:1fr;gap:26px}
  .rail{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
}
@media(max-width:860px){
  .hero{padding:22px 18px;border-radius:20px;gap:20px}
  .hero-num{font-size:36px}
  .hero h1{font-size:22px}
  .hero-sub{font-size:12.5px}
  .hero-fig{margin-top:18px}
  .hero-spark{margin-top:12px}
  .hero-spark svg{height:40px!important}
  .hero-strip{margin-top:16px;padding-top:14px;gap:12px 0}
  .hs{flex:0 0 50%;min-width:0;padding-right:10px}
  .hero-donut{gap:16px}
  .donut-c svg{width:132px!important;height:132px!important}
  .donut-mid b{font-size:22px}
  .rtile{padding:14px 15px;border-radius:15px}
  .rtile-n{font-size:24px}
  .bars{height:118px}
  .tagsheet{grid-template-columns:repeat(2,1fr)}
  .kbtn{display:none}
}


/* ================= BUILD 5 ================= */
.sub-hd{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line-2);transition:.13s;text-align:left;width:100%;cursor:pointer}
.sub-hd:hover{background:#FAFAFE}
.sub-hd:last-child{border-bottom:none}
.sub-av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;letter-spacing:-.02em}
.sub-b{flex:1;min-width:0}
.sub-t{font-size:13.5px;font-weight:600;line-height:1.35}
.sub-m{font-size:12px;color:var(--text-3);margin-top:3px}
.varbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;font-family:var(--mono)}
.cmp{display:grid;grid-template-columns:minmax(0,1.6fr) 84px 84px 108px 132px;gap:0;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line-2)}
.cmp.hd{background:#FBFBFE;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:11px 20px}
.cmp.ok-row{background:#FCFEFD}
.cmp.var-row{background:var(--warn-soft)}
.cmp.done-row{opacity:.5}
.cmp-n{font-size:13.5px;font-weight:600}
.cmp-s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.cmp-v{font-family:var(--mono);font-size:13.5px;text-align:right;padding-right:12px}
.cmp-a{display:flex;gap:6px;justify-content:flex-end}
.mini{padding:7px 10px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--surface);transition:.14s;white-space:nowrap}
.mini:hover{border-color:#CFD2E4}
.mini.acc:hover{border-color:var(--ok);color:#0A7A45;background:var(--ok-soft)}
.mini.rej:hover{border-color:var(--bad);color:#B5332B;background:var(--bad-soft)}
.mini.on-acc{background:var(--ok);border-color:var(--ok);color:#fff}
.mini.on-rej{background:var(--bad);border-color:var(--bad);color:#fff}
.trust{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--line-2)}
.trust:last-child{border-bottom:none}
.trust-b{flex:1;min-width:0}
.trust-bar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:7px}
.trust-bar i{display:block;height:100%;border-radius:6px}
.flow{display:flex;flex-direction:column;gap:0;padding:6px 20px 20px}
.fl{display:flex;gap:15px;position:relative;padding-bottom:24px}
.fl:last-child{padding-bottom:0}
.fl::before{content:'';position:absolute;left:17px;top:38px;bottom:-2px;width:2px;background:var(--line)}
.fl:last-child::before{display:none}
.fl-n{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;z-index:1;font-family:var(--display);font-weight:800;font-size:14px;border:2.5px solid var(--surface)}
.fl-b{flex:1;min-width:0;padding-top:5px}
.fl-t{font-size:14px;font-weight:600;line-height:1.35}
.fl-d{font-size:13px;color:var(--text-2);margin-top:5px;line-height:1.6}
.fl-w{background:#FBFBFE;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:10px;font-size:12.5px;color:var(--text-2);line-height:1.55}
.fl-w b{color:var(--text)}
@media(max-width:860px){
  .cmp{grid-template-columns:1fr 68px 68px;gap:8px 0;padding:13px 16px}
  .cmp.hd{display:none}
  .cmp-a{grid-column:1/-1;justify-content:flex-start;margin-top:4px}
  .cmp>div:nth-child(4){grid-column:1/-1;text-align:left;padding-right:0}
}


/* ================= BUILD 6 ================= */
.drop{border:2px dashed var(--line);border-radius:18px;padding:34px 22px;text-align:center;background:#FBFBFE;transition:.2s}
.drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.drop-ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.drop-ic svg{width:28px;height:28px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr) 96px;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line-2)}
.maprow:last-of-type{border-bottom:none}
.map-src{font-family:var(--mono);font-size:12.5px;background:var(--line-2);padding:8px 11px;border-radius:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-ar{display:grid;place-items:center;color:var(--text-3)}
.map-ar svg{width:15px;height:15px;stroke:currentColor}
.map-sel{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--surface)}
.map-sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.map-sel.unset{color:var(--text-3);border-style:dashed}
.iss{display:flex;gap:13px;padding:15px 20px;border-bottom:1px solid var(--line-2)}
.iss:last-child{border-bottom:none}
.iss-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.iss-ic svg{width:16px;height:16px}
.iss-t{font-size:13.5px;font-weight:600}
.iss-d{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.55}
.iss-a{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.iss-n{margin-left:auto;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.03em;flex:none}
.prev{font-size:12.5px}
.prev th{font-size:10px;padding:10px 12px}
.prev td{padding:9px 12px;font-size:12px;white-space:nowrap}
.prev .new{background:var(--ok-soft)}
.meter{height:7px;border-radius:7px;background:var(--line-2);overflow:hidden;position:relative;min-width:80px}
.meter i{display:block;height:100%;border-radius:7px}
.meter .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-3);opacity:.5}
.radio{border:1.5px solid var(--line);border-radius:13px;padding:14px;text-align:left;transition:.15s;background:var(--surface);width:100%;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.radio:hover{border-color:#CFD2E4}
.radio.on{border-color:var(--brand);background:var(--brand-soft)}
.radio-d{width:18px;height:18px;border-radius:50%;border:2px solid #C9CCDE;flex:none;margin-top:2px;display:grid;place-items:center;transition:.15s}
.radio.on .radio-d{border-color:var(--brand)}
.radio.on .radio-d::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--brand)}
.radio-t{font-size:13.5px;font-weight:600}
.radio-m{font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.5}
.serialrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-2)}
.serialrow:last-of-type{border-bottom:none}
.serialrow .tagn{font-family:var(--mono);font-size:12px;color:var(--text-2);width:104px;flex:none}
.serialrow input{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:var(--mono);font-size:12.5px}
.serialrow input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.serialrow input.filled{border-color:var(--ok);background:var(--ok-soft)}
.chan{display:flex;gap:6px}
.chan button{width:30px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:.14s}
.chan button svg{width:14px;height:14px;stroke:var(--text-3)}
.chan button.on{background:var(--brand);border-color:var(--brand)}
.chan button.on svg{stroke:#fff}
.cert{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 14px 40px -22px rgba(16,18,35,.3)}
.cert-bar{height:7px;background:var(--bad)}
@media(max-width:860px){
  .maprow{grid-template-columns:1fr;gap:7px;padding:14px 16px}
  .map-ar{display:none}
  .prev td,.prev th{white-space:normal}
}


/* ================= BUILD 7 — ASSET OVERVIEW ================= */
.sect{margin-top:4px}
.sect-h{display:flex;align-items:flex-end;gap:16px;padding:4px 2px 14px;flex-wrap:wrap}
.sect-l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.sect-t{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.sect-s{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.ss{text-align:right}
.ss-v{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ss-l{font-size:11px;color:var(--text-3);margin-top:4px}
.ovgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ov-wide{grid-column:span 2}

/* status by category matrix */
.mx-h{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,46px)) minmax(0,110px);gap:0;padding:11px 20px;background:#FBFBFE;border-bottom:1px solid var(--line);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.mx-h span:not(:first-child){text-align:center}
.mx-h span:last-child{text-align:left;padding-left:12px}
.mx{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,46px)) minmax(0,110px);gap:0;padding:12px 20px;border-bottom:1px solid var(--line-2);align-items:center;transition:.13s;width:100%;text-align:left;cursor:pointer}
.mx:hover{background:#FAFAFE}
.mx:last-child{border-bottom:none}
.mx-n{display:flex;align-items:center;gap:9px;min-width:0}
.mx-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.mx-ic svg{width:13px;height:13px}
.mx-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-c{text-align:center;font-family:var(--mono);font-size:12.5px;font-weight:500}
.mx-c.z{color:var(--line);font-weight:400}
.mx-b{display:flex;height:8px;border-radius:8px;overflow:hidden;gap:1.5px;margin-left:12px;background:var(--line-2)}
.mx-b i{display:block;height:100%}
.mx-f{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,46px)) minmax(0,110px);padding:13px 20px;border-top:1px solid var(--line);background:#FBFBFE;align-items:center}
.mx-f .mx-t{font-weight:700}
.mx-f .mx-c{font-weight:700;font-size:13px}

/* age profile */
.age-r{display:flex;align-items:center;gap:12px;padding:9px 20px}
.age-y{font-family:var(--mono);font-size:12px;color:var(--text-2);width:38px;flex:none}
.age-t{flex:1;height:22px;border-radius:7px;background:var(--line-2);overflow:hidden;position:relative}
.age-t i{display:block;height:100%;border-radius:7px;transition:.3s}
.age-n{font-family:var(--mono);font-size:12px;font-weight:600;width:26px;text-align:right;flex:none}
.age-k{display:flex;gap:14px;padding:12px 20px 0;flex-wrap:wrap}
.age-k span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-weight:500}
.age-k i{width:8px;height:8px;border-radius:3px}

/* most valuable */
.tv{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line-2);transition:.13s;width:100%;text-align:left;cursor:pointer}
.tv:hover{background:#FAFAFE}
.tv:last-child{border-bottom:none}
.tv-r{font-family:var(--display);font-size:12px;font-weight:800;color:var(--text-3);width:16px;flex:none}
.tv-b{flex:1;min-width:0}
.tv-n{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-bar{height:5px;border-radius:5px;background:var(--line-2);overflow:hidden;margin-top:6px}
.tv-bar i{display:block;height:100%;border-radius:5px}
.tv-v{font-family:var(--mono);font-size:12.5px;font-weight:600;flex:none;text-align:right}
.tv-m{font-size:10.5px;color:var(--text-3);margin-top:3px}

/* brands */
.br-r{display:flex;align-items:center;gap:11px;padding:10px 20px}
.br-i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:-.03em}
.br-b{flex:1;min-width:0}
.br-n{font-size:12.5px;font-weight:600}
.br-t{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:5px}
.br-t i{display:block;height:100%;border-radius:6px}
.br-v{font-family:var(--mono);font-size:12.5px;font-weight:600;flex:none;width:26px;text-align:right}

/* lifecycle */
.lc{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2)}
.lc-i{background:var(--surface);padding:16px 18px}
.lc-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}

function assets(){

  if(state.fcat!=='all') list = list.filter(a=>a.cat===state.fcat);
  if(state.floc!=='all') list = list.filter(a=>a.loc===state.floc);
  if(state.q){ const q=state.q.toLowerCase(); list = list.filter(a=>(a.tag+a.name+a.make+a.holder).toLowerCase().includes(q)); }

  const rows = list.map(a=>{
    const c=C(a.cat), lo=L(a.loc==='transit'?'vw':a.loc), st=ST[a.status];
    const on = state.sel.has(a.tag);
    return `<tr class="${on?'picked':''}" onclick="openAsset('${a.tag}')">
      <td onclick="event.stopPropagation();pick('${a.tag}')"><span class="cbx ${on?'on':''}">${svg('check',3.2)}</span></td>
      <td><span class="tag">${a.tag}</span></td>
      <td><div class="aname">${a.name}</div><div class="amake">${a.make}</div></td>
      <td><span class="pill" style="background:${c.soft};color:${c.color}">${c.name}</span></td>
      <td><span class="loc">${a.status==='transit'?'<span class="lic" style="background:#2E7FF0"></span>In transit':`<span class="lic" style="background:${lo.color}"></span>${lo.name}`}</span></td>
      <td><span class="pill ${st.cls}"><span class="pd"></span>${st.label}</span></td>
      <td style="color:var(--text-2)">${a.holder}</td>
      ${canSeeCost()?`<td class="mono" style="font-size:12.5px">${money(a.cost)}</td>`:''}

  <div class="toolbar">
    <div class="search">${svg('search')}<input placeholder="Search tag, serial, name or holder" value="${state.q}" oninput="state.q=this.value;render()"></div>

      ${CAT.map(c=>`<option value="${c.id}" ${state.fcat===c.id?'selected':''}>${c.name}</option>`).join('')}

    <select class="sel" onchange="state.floc=this.value;render()">
      <option value="all">All locations</option>
      ${LOC.map(l=>`<option value="${l.id}" ${state.floc===l.id?'selected':''}>${l.name}</option>`).join('')}
    </select>
    <button class="btn btn-g" onclick="toast('Export queued — CSV will download when the backend is wired')">${svg('down')}Export</button>

  </div>
  <div class="card">
    <div class="card-h bd"><div><div class="card-t">${list.length} asset${list.length===1?'':'s'}</div>
    <div class="card-s">Select rows to transfer, request repair or print tags${canSeeCost()?'':' · purchase cost hidden for your role'}</div></div></div>

      <thead><tr><th style="width:44px"></th><th>Tag</th><th>Asset</th><th>Category</th><th>Location</th><th>Status</th><th>Assigned to</th>${canSeeCost()?'<th>Purchase cost</th>':''}</tr></thead>

}

function setBrand(hex){
  CO.brand = hex;
  document.documentElement.style.setProperty('--brand',hex);
  document.documentElement.style.setProperty('--brand-soft',hex+'1A');
  document.documentElement.style.setProperty('--brand-ink',shade(hex,-22));
  render();
}
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16); const f=(v)=>Math.max(0,Math.min(255,Math.round(v+v*pct/100)));
  return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function inventory(){
  let list = INV.slice();
  if(state.invCat!=='all') list = list.filter(i=>i.cat===state.invCat);
  if(state.invQ){ const q=state.invQ.toLowerCase(); list = list.filter(i=>(i.sku+i.name).toLowerCase().includes(q)); }

  const low = INV.filter(i=>stockState(i)!=='ok').length;
  const val = INV.reduce((s,i)=>s+stockAt(i)*i.cost,0);
  const where = state.scope==='all' ? 'across all locations' : 'at '+L(state.scope).name;

  const rows = list.map(i=>{
    const c=IC(i.cat), q=stockAt(i), st=stockState(i);
    const pct = Math.min(100, Math.round(q/(i.reorder*2.5)*100));
    const col = st==='out'?'#E14B42':st==='low'?'#E39A11':'#0FA45E';
    return `<tr onclick="openStock('${i.sku}')">
      <td><span class="tag">${i.sku}</span></td>
      <td><div class="aname">${i.name}</div><div class="amake">${i.unit}</div></td>
      <td><span class="pill" style="background:${c.soft};color:${c.color}">${c.name}</span></td>
      <td style="min-width:150px">
        <div style="display:flex;align-items:baseline;gap:5px"><b class="mono" style="font-size:14px;color:${col}">${q.toLocaleString()}</b>
        <span style="font-size:11.5px;color:var(--text-3)">${i.unit}</span></div>
        <div class="stockbar"><i style="width:${pct}%;background:${col}"></i></div>
      </td>
      <td class="mono" style="font-size:12.5px;color:var(--text-2)">${i.reorder.toLocaleString()}</td>
      <td><span class="pill ${st==='out'?'p-bad':st==='low'?'p-warn':'p-ok'}"><span class="pd"></span>${st==='out'?'Out of stock':st==='low'?'Below reorder':'In stock'}</span></td>
      ${canSeeCost()?`<td class="mono" style="font-size:12.5px">${money(q*i.cost)}</td>`:''}
    </tr>`;
  }).join('');

  return `
  <div class="toolbar">
    <div class="search">${svg('search')}<input placeholder="Search SKU or item name" value="${state.invQ}" oninput="state.invQ=this.value;render()"></div>

    <button class="btn btn-p" style="margin-left:auto" onclick="toast('New stock item form opens here')">${svg('plus')}Add item</button>
  </div>

  <div class="kpis" style="margin-bottom:18px">
    ${[{v:INV.length,l:'Stock items tracked',ic:'layers',c:'#5B4BE8',s:'#EEEBFE'},
       {v:low,l:'At or below reorder',ic:'alert',c:'#E39A11',s:'#FDF3E0'},
       {v:INV.filter(i=>stockState(i)==='out').length,l:'Out of stock',ic:'x',c:'#E14B42',s:'#FDECEB'},
       {v:canSeeCost()?short(val):'Hidden',l:canSeeCost()?'Stock value '+where:'Value restricted',ic:canSeeCost()?'naira':'lock',c:'#0FA45E',s:'#E4F7ED'}]
      .map(k=>`<div class="kpi"><div class="kpi-top"><span class="kpi-ic" style="background:${k.s};color:${k.c}">${svg(k.ic)}</span></div>
      <div class="kpi-v">${k.v}</div><div class="kpi-l">${k.l}</div></div>`).join('')}

  </div>`;
}

  if(n>w.step){
    if(w.step===0 && !w.assets.size) return toast('Pick at least one asset to move');
    if(w.step===1 && !w.to) return toast('Choose a destination');
  }
  w.step=Math.max(0,Math.min(3,n)); render(); window.scrollTo({top:0,behavior:'smooth'});
}
function wizPick(tag){ const w=state.wiz; w.assets.has(tag)?w.assets.delete(tag):w.assets.add(tag); render(); }
function wizTo(id){ state.wiz.to=id; render(); }
function wizSubmit(){
  const w=state.wiz, n=w.assets.size;
  const chain = n>=5 ? POLICIES[1] : POLICIES[0];
  toast(`Transfer submitted · ${n} assets · routed to ${chain.chain[0]}`);
  state.wiz=null; setTimeout(()=>go('requests'),900);
}

        </button>`).join('')}</div>
    </div>`;
  }

  if(w.step===2){
    body = `<div class="card">
      <div class="card-h bd"><div><div class="card-t">Movement details</div>
      <div class="card-s">These print on the waybill and are frozen once it is issued</div></div></div>

      </div>

        <input class="inp" placeholder="Anything they should check on arrival" value="${w.notes}" oninput="state.wiz.notes=this.value">
      </div>
    </div>`;
  }

  if(w.step===3){
    const to=L(w.to||'abj');

      <div class="card">

}

/* ---------------- LOCATION ARCHIVING ---------------- */
let ARCHIVED = [];
const liveLocs = () => LOC.filter(l=>!ARCHIVED.includes(l.id));
function locHolds(id){
  return {
    assets: AST.filter(a=>a.loc===id && a.status!=='retired').length,
    stock: INV.filter(i=>(i.stock[id]||0)>0).length,
    moves: DOCS.filter(d=>(d.from===id||d.to===id) && d.status!=='received').length
  };
}
function askDelete(id){
  const l=L(id), h=locHolds(id), blocked = h.assets||h.stock||h.moves;
  if(l.type==='virtual') return modal('bad','alert','The virtual warehouse cannot be removed',
    'It is where retired, unassigned and swept assets live. Removing it would leave those assets with nowhere to sit.',
    [['Close','btn-g','closeModal()']]);
  if(blocked){
    const onlyMoves = h.moves && !h.assets && !h.stock;
    return modal('warn','alert',`${l.name} still holds things`,
      onlyMoves
        ? `Its registers are empty, but ${h.moves} consignment${h.moves===1?'':'s'} to or from here ${h.moves===1?'has':'have'} not been accepted yet.`
        : `You cannot archive a location while anything lives there. Sweep the contents to the virtual warehouse first — every item keeps its history and a waybill is issued for the move.`,
      onlyMoves
        ? [['Cancel','btn-g','closeModal()'],['Review open movements','btn-p','closeModal();go("transfers")']]
        : [['Cancel','btn-g','closeModal()'],['Sweep to virtual warehouse','btn-p',`sweep('${id}')`]],
      `<div class="kv" style="margin-bottom:14px">
        <div><div class="fact-l">Assets on register</div><div class="fact-v mono">${h.assets}</div></div>
        <div><div class="fact-l">Stock lines held</div><div class="fact-v mono">${h.stock}</div></div>
        <div><div class="fact-l">Open movements</div><div class="fact-v mono">${h.moves}</div></div>
      </div>
      ${h.moves?`<div class="warn-box"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <p>${h.moves} consignment${h.moves===1?' is':'s are'} still in transit to or from here. ${onlyMoves?'Accept or cancel ':'Those must be accepted or cancelled before anything can be swept — '}${onlyMoves?'each one and this location can then be archived.':'an asset cannot be moved while it is already moving.'}</p></div>`:''}`);
  }
  modal('warn','trash',`Archive ${l.name}?`,
    'Archiving hides this location from every picker, dashboard and report. It does not delete it.',
    [['Cancel','btn-g','closeModal()'],['Archive location','btn-p',`doArchive('${id}')`]],
    `<div class="frozen" style="margin-bottom:0">${svg('shield')}
      <p><b>Why archive rather than delete.</b> Waybill <span class="mono">WB-2026-0146</span>, ${AST.filter(a=>a.status!=='retired').length} asset histories and every audit entry reference this location by name. Deleting the record would turn all of those into dangling references and quietly break your audit trail. Archived locations still resolve everywhere they are mentioned — they simply stop being somewhere you can send things.</p></div>`);
}
function sweep(id){
  const l=L(id), h=locHolds(id);
  AST.forEach(a=>{ if(a.loc===id && a.status!=='retired'){ a.loc='vw'; a.status='idle'; a.holder='—'; } });
  INV.forEach(i=>{ if(i.stock[id]){ i.stock.vw=(i.stock.vw||0)+i.stock[id]; i.stock[id]=0; } });
  closeModal();
  toast(`${h.assets} assets and ${h.stock} stock lines swept to the virtual warehouse · waybill WB-2026-0150 issued`);
  render();
}
function doArchive(id){
  ARCHIVED.push(id); closeModal();
  toast(`${L(id).name} archived · it still resolves in history and on past waybills`);
  if(state.scope===id){ state.scope='all'; updateScope(); }
  render();
}
function unarchive(id){ ARCHIVED=ARCHIVED.filter(x=>x!==id); toast(`${L(id).name} restored`); render(); }

/* ---------------- MODAL ---------------- */
function modal(tone,icon,title,sub,actions,extra){
  const tones={bad:['var(--bad-soft)','var(--bad)'],warn:['var(--warn-soft)','var(--warn)'],ok:['var(--ok-soft)','var(--ok)'],br:['var(--brand-soft)','var(--brand)']};
  const t=tones[tone]||tones.br;
  let w=document.getElementById('modalWrap');
  if(!w){ w=document.createElement('div'); w.className='modal-wrap'; w.id='modalWrap';
    w.addEventListener('click',e=>{ if(e.target===w) closeModal(); });
    document.body.appendChild(w); }
  w.innerHTML=`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><span class="modal-ic" style="background:${t[0]};color:${t[1]}">${svg(icon)}</span>
    <div><h3>${title}</h3><p>${sub}</p></div></div>
    ${extra?`<div class="modal-b">${extra}</div>`:''}
    <div class="modal-f">${actions.map(a=>`<button class="btn ${a[1]}" onclick="${a[2]}">${a[0]}</button>`).join('')}</div>
  </div>`;
  w.classList.add('on');
}

function catalog(){
  const c=state.cat;
  const crumb = `<div class="crumb">
    <button onclick="catGo(null,null,null)">Catalog</button>
    ${c.cat?`<span class="sep">${svg('arrow')}</span>${c.sub?`<button onclick="catGo('${c.cat}',null,null)">${C(c.cat).name}</button>`:`<span class="cur">${C(c.cat).name}</span>`}`:''}
    ${c.sub?`<span class="sep">${svg('arrow')}</span>${c.brand?`<button onclick="catGo('${c.cat}','${c.sub}',null)">${S(c.sub).name}</button>`:`<span class="cur">${S(c.sub).name}</span>`}`:''}
    ${c.brand?`<span class="sep">${svg('arrow')}</span><span class="cur">${B(c.brand).n}</span>`:''}
  </div>`;

  // level 1 — categories
  if(!c.cat){
    return crumb + `<div class="card">
      <div class="card-h bd"><div><div class="card-t">Categories</div>
      <div class="card-s">The catalog describes what a thing <i>is</i>. The register records the individual units you own.</div></div></div>
      <div class="gridauto">${CAT.map(x=>{
        const subs=subsIn(x.id), models=subs.reduce((s,y)=>s+modelsIn(y.id).length,0);
        const units=subs.reduce((s,y)=>s+modelsIn(y.id).reduce((t,m)=>t+countOf(m.id),0),0);
        return `<button class="tile2" onclick="catGo('${x.id}',null,null)">
          <span class="tile2-ic" style="background:${x.soft};color:${x.color}">${svg(x.icon)}</span>
          <span style="min-width:0"><span class="tile2-n">${x.name}</span>
          <span class="tile2-m">${subs.length} type${subs.length===1?'':'s'} · ${models} model${models===1?'':'s'}</span></span>
          <span class="tile2-c"><b>${units}</b><span>units</span></span>
        </button>`;
      }).join('')}</div>
    </div>`;
  }

  // level 2 — sub-categories
  if(!c.sub){
    const subs=subsIn(c.cat);
    return crumb + `<div class="card">
      <div class="card-h bd"><div><div class="card-t">${C(c.cat).name} · types</div>
      <div class="card-s">Types group models that do the same job, whoever makes them</div></div></div>

        const ms=modelsIn(s.id), br=brandsIn(s.id);

          <span class="tile2-m">${br.map(b=>B(b).n).join(', ')}</span></span>
          <span class="tile2-c"><b>${ms.reduce((t,m)=>t+countOf(m.id),0)}</b><span>units</span></span>
        </button>`;
      }).join('')}</div>
    </div>`;
  }

  // level 3 — brands, then models
  const brands = brandsIn(c.sub);
  const models = c.brand ? modelsIn(c.sub).filter(m=>m.brand===c.brand) : modelsIn(c.sub);
  return crumb + `
  <div class="card" style="margin-bottom:18px">
    <div class="card-h bd"><div><div class="card-t">Brands making ${S(c.sub).name.toLowerCase()}</div>
    <div class="card-s">Pick one to narrow the models below</div></div>
    ${c.brand?`<span class="act"><button class="linkbtn" onclick="catGo('${c.cat}','${c.sub}',null)">Show all brands</button></span>`:''}</div>
    <div class="gridauto">${brands.map(b=>{
      const bm=modelsIn(c.sub).filter(m=>m.brand===b);
      const u=bm.reduce((t,m)=>t+countOf(m.id),0);
      return `<button class="tile2" style="${c.brand===b?'border-color:var(--brand);background:var(--brand-soft)':''}" onclick="catGo('${c.cat}','${c.sub}','${b}')">
        <span class="tile2-ic" style="background:${B(b).c}1A;color:${B(b).c}">${B(b).n.slice(0,2).toUpperCase()}</span>
        <span style="min-width:0"><span class="tile2-n">${B(b).n}</span>
        <span class="tile2-m">${bm.length} model${bm.length===1?'':'s'}</span></span>

  <div class="card">
    <div class="card-h bd"><div><div class="card-t">${models.length} model${models.length===1?'':'s'}</div>

      <tbody>${models.map(m=>`<tr onclick="openModel('${m.id}')">
        <td><span class="pill" style="background:${B(m.brand).c}1A;color:${B(m.brand).c}">${B(m.brand).n}</span></td>
        <td><div class="aname">${m.name}</div><div class="amake">Introduced ${m.year}</div></td>

}

/* ---------------- CHART HELPERS (hand-drawn SVG, no library) ---------------- */
function sparkPath(v,w,h,pad){
  pad=pad||2; const mn=Math.min(...v), mx=Math.max(...v), r=(mx-mn)||1;
  const x=i=>pad+i*((w-pad*2)/(v.length-1));
  const y=n=>h-pad-((n-mn)/r)*(h-pad*2);
  let d=`M${x(0).toFixed(1)} ${y(v[0]).toFixed(1)}`;
  for(let i=1;i<v.length;i++){
    const px=x(i-1),py=y(v[i-1]),cx=x(i),cy=y(v[i]),m=(px+cx)/2;
    d+=` C${m.toFixed(1)} ${py.toFixed(1)} ${m.toFixed(1)} ${cy.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
  }
  return {d, lastX:x(v.length-1), lastY:y(v[v.length-1])};
}
function spark(v,w,h,color,id){
  const p=sparkPath(v,w,h,4);
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;height:${h}px">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".34"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${p.d} L${w-4} ${h} L4 ${h} Z" fill="url(#g${id})"/>
    <path d="${p.d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="1400" stroke-dashoffset="1400" style="animation:draw 1.4s cubic-bezier(.3,.8,.4,1) .25s forwards"/>
    <circle cx="${p.lastX.toFixed(1)}" cy="${p.lastY.toFixed(1)}" r="3.4" fill="${color}" opacity="0" style="animation:pop .3s ease 1.5s forwards"/>
  </svg>`;
}
function donut(segs,size){
  const r=(size/2)-11, C=2*Math.PI*r, total=segs.reduce((s,x)=>s+x.v,0)||1;
  let off=0;
  const arcs=segs.map((s,i)=>{
    const len=(s.v/total)*C, dash=`${Math.max(0,len-2.5)} ${C-Math.max(0,len-2.5)}`;
    const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${size/2} ${size/2})" opacity="0"
      style="animation:fadeIn .5s ease ${(0.35+i*0.11).toFixed(2)}s forwards"/>`;
    off+=len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="13"/>${arcs}</svg>`;
}

/* ---------------- TAGS & SCANNING ---------------- */
function qr(seed){
  let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  const n=9, cells=[];
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const corner=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
    if(corner) continue;
    h=(h*1103515245+12345)>>>0;
    if((h>>>16)%100<47) cells.push(`<rect x="${x*7+2}" y="${y*7+2}" width="6" height="6" rx="1.2"/>`);
  }
  const eye=(x,y)=>`<rect x="${x}" y="${y}" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="3.5"/><rect x="${x+7}" y="${y+7}" width="6" height="6" rx="1.5"/>`;
  return `<svg class="qr" viewBox="0 0 67 67" fill="currentColor" style="color:var(--ink)">
    ${eye(2,2)}${eye(45,2)}${eye(2,45)}${cells.join('')}</svg>`;
}

state.subId=null; state.dec={};
function openSub(id){ state.subId=id; state.dec={}; go('review'); }
function decide(k,v){ state.dec[k] = state.dec[k]===v ? null : v; render(); }
function acceptMatching(){
  const s=SUBS.find(x=>x.id===state.subId); if(!s||s.type!=='count') return;
  s.lines.forEach(l=>{ if(l.sys===l.sub) state.dec[l.k]='acc'; });
  render(); toast('Every matching line accepted — only the variances are left');
}
function commitSub(){
  const s=SUBS.find(x=>x.id===state.subId); if(!s) return;
  const u=me(), h=H(s.by);
  if(s.type==='count'){
    let acc=0, rej=0;
    s.lines.forEach(l=>{
      const d=state.dec[l.k];
      if(d==='acc'){ const i=INV.find(x=>x.sku===l.k); if(i){ i.stock[s.loc]=l.sub; } acc++; }
      else if(d==='rej') rej++;
    });
    logEvent(u.n,u.av,u.c,'Reviewed stock count',s.id,
      `${h.n} at ${L(s.loc).name} · ${acc} lines accepted${rej?`, ${rej} rejected`:''}`, rej?'warn':'ok');
    toast(`${acc} lines written to the ${L(s.loc).name} register${rej?` · ${rej} rejected with a reason sent back to ${h.n}`:''}`);
  } else if(s.type==='fault'){
    const a=AST.find(x=>x.tag===s.asset); if(a) a.status='repair';
    logEvent(u.n,u.av,u.c,'Opened repair from a fault report',s.asset,`Reported by ${h.n} at ${L(s.loc).name}`,'warn');
    toast(`Repair request raised for ${s.asset} · ${a?a.name:''} is now marked In repair`);
  } else if(s.type==='transfer'){
    logEvent(u.n,u.av,u.c,'Converted a field request to a transfer','TR-0314',`${s.asset} to ${L(s.dest).name}, requested by ${h.n}`,'info');
    toast(`Transfer request raised for ${s.asset} — now in the approval chain`);
  }
  s.status='done'; s.ago='just now';
  setTimeout(()=>go('submissions'),700);
}

function review(){
  const s=SUBS.find(x=>x.id===state.subId) || SUBS[0];

  const head = `

      <span class="act"><span class="pill" style="background:${t.s};color:${t.c}"><span class="pd"></span>Pending your review</span></span></div>
      <div class="dfacts">
        <div class="fact"><div class="fact-l">Submitted by</div><div class="fact-v">${h.n}</div></div>
        <div class="fact"><div class="fact-l">Their record</div><div class="fact-v">${h.match}% accepted as sent</div></div>
        <div class="fact"><div class="fact-l">Location</div><div class="fact-v">${lo.name}</div></div>
        <div class="fact"><div class="fact-l">When</div><div class="fact-v" style="font-size:13px">${s.when}</div></div>
        <div class="fact"><div class="fact-l">Device</div><div class="fact-v" style="font-size:13px">${s.device}</div></div>
