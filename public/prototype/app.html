      ${s.note?`<div style="padding:16px 20px 20px"><div class="fact-l" style="margin-bottom:6px">What they wrote</div>
      <p style="font-size:13.5px;line-height:1.6;color:var(--text-2);font-style:italic">“${s.note}”</p></div>`:''}
    </div>`;

  if(s.type==='count'){
    const decided = s.lines.filter(l=>state.dec[l.k]).length;
    const accepted = s.lines.filter(l=>state.dec[l.k]==='acc').length;
    const varLines = s.lines.filter(l=>l.sys!==l.sub).length;
    return head + `
    <div class="card">
      <div class="card-h bd"><div><div class="card-t">${s.lines.length} lines counted · ${varLines} differ from the system</div>
      <div class="card-s">Accept writes their figure. Reject keeps yours and sends a reason back.</div></div>

        return `<div class="cmp ${cls}">
          <div><div class="cmp-n">${invName(l.k)}</div><div class="cmp-s mono">${l.k} · ${l.u}</div></div>

          <div class="cmp-v" style="font-weight:700">${l.sub.toLocaleString()}</div>
          <div style="text-align:right;padding-right:12px">${diff
            ? `<span class="varbadge" style="background:${diff<0?'var(--bad-soft)':'var(--warn-soft)'};color:${diff<0?'#B5332B':'#A6700A'}">${diff>0?'+':''}${diff} · ${pc}%</span>`
            : `<span class="varbadge" style="background:var(--ok-soft);color:#0A7A45">match</span>`}</div>
          <div class="cmp-a">
            <button class="mini acc ${d==='acc'?'on-acc':''}" onclick="decide('${l.k}','acc')">${d==='acc'?'Accepted':'Accept'}</button>
            <button class="mini rej ${d==='rej'?'on-rej':''}" onclick="decide('${l.k}','rej')">${d==='rej'?'Rejected':'Reject'}</button>
          </div>
        </div>`;
      }).join('')}
      <div class="acceptbar">
        <span class="acceptbar-s">${decided
          ? `<b>${accepted}</b> lines will be written · <b>${decided-accepted}</b> rejected · ${s.lines.length-decided} still undecided`
          : `Decide each line, or accept the matching ones in a single click`}</span>

          ${svg('check',2.4)}Apply ${accepted} to the register</button>

    <p style="font-size:12.5px;color:var(--text-3);margin-top:14px;line-height:1.6;text-align:center;max-width:600px;margin-inline:auto">
      Applying writes every accepted figure, the audit rows and the reply to ${h.n} in one transaction.
      ${h.match<85?`<br><b style="color:var(--warn)">${h.n}'s counts are adjusted more often than most — worth a spot-check before accepting.</b>`:''}</p>`;
  }

  if(s.type==='fault'){
    const a=AST.find(x=>x.tag===s.asset)||AST[0];
    return head + `
    <div class="card">
      <div class="card-h bd"><div><div class="card-t">Reported fault</div>

        <div class="amake"><span class="tag">${a.tag}</span> · ${a.make} · currently ${ST[a.status].label.toLowerCase()}</div></div>
        <span class="pill p-warn"><span class="pd"></span>${s.fault}</span>
      </div>
      <div style="padding:18px 20px 20px">
        <div class="logo-drop" style="margin-bottom:16px">
          <span class="cat-ic" style="background:var(--brand-soft);color:var(--brand);width:44px;height:44px">${svg('eye')}</span>
          <div style="flex:1;min-width:120px"><div style="font-size:13.5px;font-weight:600">Photo attached</div>
          <div class="hint">Taken on the device at ${s.when}, with location. A fault report with a photo is much harder to argue with later.</div></div>
          <button class="btn btn-g" onclick="toast('Photo opens full screen')">View</button>

        <div class="warn-box">${svg('alert')}
          <p>${h.n} has already taken this off the rack. Until you accept, the register still shows it as in service — which means someone could raise a transfer for a tool that is sitting in a corner unusable.</p></div>
      </div>
      <div class="acceptbar">
        <span class="acceptbar-s">Accepting marks <b class="mono">${s.asset}</b> as In repair and opens a repair request</span>
        <div style="margin-left:auto;display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn btn-g" onclick="toast('Sent back to ${h.n} asking for more detail')">Ask for more detail</button>
          <button class="btn btn-p btn-lg" onclick="commitSub()">${svg('check',2.4)}Accept and open a repair</button>
        </div>
      </div>
    </div>`;
  }

  if(s.type==='transfer'){
    const a=AST.find(x=>x.tag===s.asset)||AST[0], d=L(s.dest);
    return head + `
    <div class="card">

function resolveDisc(id,how){

  const u=me(), labels={found:'Found and received',writeoff:'Written off',carrier:'Charged to the carrier'};
  d.open=false;
  logEvent(u.n,u.av,u.c,'Resolved discrepancy',d.id,`${d.tag} · ${labels[how]} · open ${d.days} day${d.days===1?'':'s'}`,how==='found'?'ok':'warn');

      <div class="fact"><div class="fact-l">Book value now</div><div class="fact-v mono">${canSeeCost()?money(book):'Hidden'}</div></div>
      <div class="fact"><div class="fact-l">Warranty</div><div class="fact-v">${age*12>=(m?m.warr:12)?'Expired':'Active'}</div></div>
    </div>
    <div style="height:18px"></div>
    <div class="field"><label class="lbl">How did it leave the company?</label>
      ${DISPOSE.map(x=>`<button class="radio ${d.how===x[0]?'on':''}" onclick="state.disp.how='${x[0]}';render()">
        <span class="radio-d"></span><span><span class="radio-t">${x[1]}</span><span class="radio-m">${x[2]}</span></span></button>`).join('')}

state.sm={mode:'transfer', from:'lag', to:'phc', lines:{}, job:''};
function smQty(sku,v){ state.sm.lines[sku]=Math.max(0,v); render(); }
function smCommit(){
  const s=state.sm, u=me();
  const picked=Object.entries(s.lines).filter(([k,v])=>v>0);
  if(!picked.length) return toast('Enter a quantity on at least one line');
  picked.forEach(([sku,q])=>{
    const i=INV.find(x=>x.sku===sku); if(!i) return;
    const avail=i.stock[s.from]||0, mv=Math.min(avail,q);
    i.stock[s.from]=avail-mv;
    if(s.mode==='transfer') i.stock[s.to]=(i.stock[s.to]||0)+mv;
  });
  if(s.mode==='transfer'){
    logEvent(u.n,u.av,u.c,'Transferred stock','WB-2026-0151',`${picked.length} lines from ${L(s.from).name} to ${L(s.to).name}`,'info');
    toast(`${picked.length} stock lines moved · waybill WB-2026-0151 issued`);
  } else {
    logEvent(u.n,u.av,u.c,'Issued stock',s.job||'Unassigned job',`${picked.length} lines consumed at ${L(s.from).name}`,'info');
    toast(`${picked.length} stock lines issued and consumed${s.job?` against ${s.job}`:''}`);
  }
  state.sm.lines={}; setTimeout(()=>go('inventory'),800);
}

          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-h bd"><div><div class="card-t">Brands owned</div>
        <div class="card-s">${wide?'Across the whole estate':'At '+L(state.scope).name} · resolved through the catalog, not typed-in text</div></div>
        <span class="act"><button class="linkbtn" onclick="go('catalog')">Catalog</button></span></div>
        <div style="padding:12px 0 14px">
          ${brands.map(([id,n])=>`<div class="br-r">
            <span class="br-i" style="background:${B(id).c}1A;color:${B(id).c}">${B(id).n.slice(0,2).toUpperCase()}</span>
            <span class="br-b"><span class="br-n">${B(id).n}</span>
            <span class="br-t"><i style="width:${pct(n,bMax)}%;background:${B(id).c}"></i></span></span>
            <span class="br-v">${n}</span></div>`).join('')}
          ${bRest>0?`<div style="padding:8px 20px 0"><span class="hint">and ${bRest} further brand${bRest===1?'':'s'} with fewer units</span></div>`:''}
        </div>
      </div>

      <div class="card">
        <div class="card-h bd"><div><div class="card-t">Lifecycle health</div>
        <div class="card-s">Against each model's warranty term and service life</div></div></div>
        <div class="lc">
          ${[
            {v:inWarranty, d:live.length, l:'Still under warranty', ic:'shield', c:'#0FA45E', s:'#E4F7ED'},
            {v:pastLife,   d:live.length, l:'Past service life, still in use', ic:'clock', c:'#E39A11', s:'#FDF3E0'},
            {v:dueSvc,     d:MAINT.length,l:'Due or overdue for service', ic:'wrench', c:'#E14B42', s:'#FDECEB', go:"go('maintenance')"},
            {v:noSerial,   d:live.length, l:'No serial, cannot be scanned', ic:'alert', c:'#9296AC', s:'#F1F2F8'}
          ].map(x=>`<div class="lc-i" ${x.go?`onclick="${x.go}" style="cursor:pointer"`:''}>
            <div class="lc-top"><span class="lc-ic" style="background:${x.s};color:${x.c}">${svg(x.ic)}</span></div>
            <div class="lc-v" style="color:${x.c}">${x.v}<span style="font-size:13px;color:var(--text-3);font-weight:600"> / ${x.d}</span></div>
            <div class="lc-l">${x.l}</div>
            <div class="lc-bar"><i style="width:${pct(x.v,x.d)}%;background:${x.c}"></i></div>
          </div>`).join('')}
        </div>
      </div>

    </div>
  </section>`;
}

/* ---- insert it between the hero and the status tiles ---- */
const _dash7 = dashboard;
dashboard = function(){
  return _dash7().replace('<section class="rail">', assetOverview() + '\n  <section class="rail">');
};
VIEWS.dashboard = dashboard;

/* the status tiles now get their own heading so the two bands read as separate things */
const _dash8 = dashboard;
dashboard = function(){
  return _dash8().replace('<section class="rail">',
    `<section class="sect" style="margin-bottom:-4px"><div class="sect-h">
       <div><div class="sect-l">Status</div><div class="sect-t">What needs you</div></div>
       <div class="sect-s"><div class="ss"><div class="ss-v">Today</div><div class="ss-l">Saturday, 25 July 2026</div></div></div>
     </div></section>
     <section class="rail">`);
};
VIEWS.dashboard = dashboard;

renderNav(); updateScope(); render();

</script>
</body>
</html>
