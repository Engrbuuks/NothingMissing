name: checks

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          NEXT_PUBLIC_ROOT_DOMAIN: nothingmissing.ng

      # The storage layer is where all file access control now lives, because
      # R2 cannot check it a second time the way Supabase policies did.
      - name: storage access control
        run: node tests-storage.mjs

      # Header matching is what makes a real customer's spreadsheet import or
      # bounce, and it is easy to break without noticing.
      - name: spreadsheet parsing
        run: node tests-parse.mjs

      # Every RPC a page calls and every table it queries must exist. A
      # mismatch is invisible until somebody opens the page and gets nothing.
      - name: pages match the schema
        run: node tests-schema.mjs

      # Twice now, working database functions shipped with no page calling
      # them — indistinguishable from not building the feature at all.
      - name: every action is reachable from a page
        run: node tests-reachable.mjs

      # A form missing a field its action reads submits happily and loses the
      # value — no error, nothing in the log, just data quietly not saved.
      - name: forms supply what their actions read
        run: node tests-forms.mjs

      # A redirect carrying a message to a page that never reads it means the
      # user acts, something happens, and the screen says nothing.
      - name: redirect messages are displayed
        run: node tests-messages.mjs

      # A button pointing at a route that does not exist looks like a broken
      # feature rather than a missing one.
      - name: internal links resolve
        run: node tests-links.mjs

      # Authentication is the one path where a mistake locks everyone out.
      # The callback route was missing entirely and nothing caught it.
      - name: authentication is wired end to end
        run: node tests-auth.mjs

      # A settings toggle for an event nothing sends describes something that
      # does not happen. Twelve of these shipped that way.
      - name: promised notifications actually send
        run: node tests-notify.mjs

      # A link to a route that does not exist is a dead end a user hits, and
      # nothing else catches it — the build compiles happily.
      - name: internal links resolve
        run: node tests-links.mjs

      # Authentication is the one path where a mistake locks everyone out.
      # The callback route was missing entirely and nothing caught it.
      - name: authentication is wired end to end
        run: node tests-auth.mjs

      # A settings toggle for an event nothing sends describes something that
      # does not happen. Twelve of these shipped that way.
      - name: promised notifications actually send
        run: node tests-notify.mjs

  database:
    name: schema, RLS and 271 assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: rebuild, migrate, seed, assert
        working-directory: backend
        run: bash scripts/test.sh
      # Supabase installs pgcrypto in `extensions`, not `public`. A migration
      # can pass every test above and still fail on deploy without this.
      - name: migrations against Supabase's extension layout
        working-directory: backend
        run: bash scripts/test_supabase_layout.sh
